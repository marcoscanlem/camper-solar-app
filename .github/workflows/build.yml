:name: Build Play Store Bundle

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Refresh Android Project Files
        run: flutter create . --platforms=android --org com.marcoscanlem --project-name camper_solar_app

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS"

      - name: Configure release signing in Gradle
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")

          if gradle_kts.exists():
              text = gradle_kts.read_text(encoding="utf-8")
              if "signingConfigs {" not in text:
                  signing_block = """
              signingConfigs {
                  create("release") {
                      val storeFilePath = System.getenv("SIGNING_STORE_FILE")
                      if (!storeFilePath.isNullOrEmpty()) {
                          storeFile = file(storeFilePath)
                          storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                          keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                          keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                      }
                  }
              }
          """
                  text = text.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              gradle_kts.write_text(text, encoding="utf-8")

          elif gradle_groovy.exists():
              text = gradle_groovy.read_text(encoding="utf-8")
              if "signingConfigs {" not in text:
                  signing_block = """
              signingConfigs {
                  release {
                      if (System.getenv("SIGNING_STORE_FILE")) {
                          storeFile file(System.getenv("SIGNING_STORE_FILE"))
                          storePassword System.getenv("SIGNING_STORE_PASSWORD")
                          keyAlias System.getenv("SIGNING_KEY_ALIAS")
                          keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                      }
                  }
              }
          """
                  text = text.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              gradle_groovy.write_text(text, encoding="utf-8")
          EOF

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build App Bundle
        env:
          SIGNING_STORE_FILE: upload-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-release
          path: build/app/outputs/bundle/release/app-release.aab